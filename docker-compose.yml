services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: minecraft-server-manager:latest
    container_name: minecraft-bedrock-manager
    restart: unless-stopped
    # host networking ensures 0-overhead UDP performance & zero NAT packet queue jitter for NetherNet/Bedrock
    network_mode: host
    volumes:
      # Persistent worlds, server.properties, backups, and Bedrock binaries
      - /home/ubuntu/minecraft-server:/data
    environment:
      - PORT=5000
      # Nginx on pro serves the public site; keep the control API loopback-only.
      - HOST=127.0.0.1
      - MINECRAFT_BASE_DIR=/data
      # Start neither edition automatically on the memory-constrained GCP VM.
      - MC_AUTO_START_BEDROCK=${MC_AUTO_START_BEDROCK:-false}
      - MC_AUTO_START_JAVA=${MC_AUTO_START_JAVA:-false}
    deploy:
      resources:
        limits:
          # Leave memory for the host OS; warn before starting both editions.
          memory: 768M
          cpus: '2.0'
        reservations:
          memory: 256M
