name: Build & Deploy Minecraft Server Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-minecraft-manager
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'static/**'
              - 'templates/**'

      - name: Setup Rust Toolchain
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Mold Linker
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: rui314/setup-mold@v1

      - name: Rust Cache
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Build Release Binary
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo build --release

      - name: Setup SSH
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is missing! Please add SSH_KEY in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is missing! Please add SSH_HOST in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Handle raw PEM key or base64 encoded
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          else
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa

          # Configure SSH client with connection multiplexing and compression
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            Compression yes
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy Rust Binary
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          TARGET_DIR="/home/ubuntu/stack/games/minecraft"

          echo "📦 Copying compiled binary to VM..."
          scp -P "$SSH_PORT" -i ~/.ssh/id_rsa target/release/minecraft-server-manager "$SSH_USER@$SSH_HOST:$TARGET_DIR/minecraft-server-manager.new"

          echo "🚀 Activating new binary..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            set -e
            TARGET_DIR="/home/ubuntu/stack/games/minecraft"
            chmod +x "$TARGET_DIR/minecraft-server-manager.new"
            mv "$TARGET_DIR/minecraft-server-manager.new" "$TARGET_DIR/minecraft-server-manager"
            sudo systemctl restart mc-manager
          EOF

      - name: Deploy Frontend Assets & Verify Service
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          TARGET_DIR="/home/ubuntu/stack/games/minecraft"

          echo "📁 Syncing static assets and templates..."
          scp -P "$SSH_PORT" -i ~/.ssh/id_rsa -r static templates "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

          echo "🔍 Verifying service health..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            sleep 2
            curl -fsS http://127.0.0.1:5000/api/status || {
              echo "Health check failed! Checking logs:"
              journalctl -u mc-manager.service --no-pager -n 20
              exit 1
            }
            echo "✅ Deployment verified healthy!"
          EOF
