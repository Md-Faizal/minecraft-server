name: Build & Deploy Minecraft Server Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-minecraft-manager
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            manager:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'Dockerfile.runtime'
              - 'docker-compose.yml'
              - 'deploy/**'
              - 'static/**'
              - 'templates/**'
              - '.github/workflows/deploy.yml'

      - name: Setup Rust Toolchain
        if: steps.filter.outputs.manager == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Mold Linker
        if: steps.filter.outputs.manager == 'true' || github.event_name == 'workflow_dispatch'
        uses: rui314/setup-mold@v1

      - name: Rust Cache
        if: steps.filter.outputs.manager == 'true' || github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Build Release Binary
        if: steps.filter.outputs.manager == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_BUILD_JOBS: "1"
        run: cargo build --release -j 1

      - name: Build Runtime Image
        if: steps.filter.outputs.manager == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p .manager-image-build
          cp Dockerfile.runtime .manager-image-build/Dockerfile
          cp target/release/minecraft-server-manager .manager-image-build/
          cp -r static templates .manager-image-build/
          docker build -t minecraft-server-manager:latest .manager-image-build
          docker save minecraft-server-manager:latest | gzip -1 > minecraft-manager-image.tar.gz

      - name: Deploy to GCP pro
        if: steps.filter.outputs.manager == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is missing."
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST must be set to the static external IP of the GCP pro VM."
            exit 1
          fi
          if [ "$SSH_HOST" = "68.233.115.138" ]; then
            echo "::error::SSH_HOST still points to my-mac. Set it to the GCP pro VM's static external IP."
            exit 1
          fi
          if getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | grep -qx '68.233.115.138'; then
            echo "::error::SSH_HOST resolves to my-mac. Set it to the GCP pro VM's static external IP."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ env.SSH_HOST }}
            User ${{ env.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port ${{ env.SSH_PORT }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            Compression yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/minecraft-deploy"
          ssh production "mkdir -p '$TARGET_DIR'"
          rsync -av --partial docker-compose.yml deploy/deploy-manager-image.sh minecraft-manager-image.tar.gz production:"$TARGET_DIR/"
          ssh production "chmod +x '$TARGET_DIR/deploy-manager-image.sh' && bash '$TARGET_DIR/deploy-manager-image.sh' '$TARGET_DIR/minecraft-manager-image.tar.gz'"
