name: Build & Deploy Minecraft Server Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-minecraft-manager
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'static/**'
              - 'templates/**'

      - name: Setup Rust Toolchain
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Mold Linker
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: rui314/setup-mold@v1

      - name: Rust Cache
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Build Release Binary
        if: steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo build --release

      - name: 🔌 Setup SSH & Deploy to Ubuntu
        if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is missing! Please configure in GitHub Repository Settings."
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is missing! Please configure in GitHub Repository Settings."
            exit 1
          fi

          # 1. Setup SSH Directory & Key (Bloomberg Terminal standard)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ env.SSH_HOST }}
            User ${{ env.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port ${{ env.SSH_PORT }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            Compression yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/stack/games/minecraft"

          echo "🚀 Step 1: Syncing static assets and templates via rsync..."
          rsync -avz static templates production:"$TARGET_DIR/"

          if [ "${{ steps.filter.outputs.rust }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "📦 Step 2: Syncing compiled Rust binary via rsync..."
            rsync -avz target/release/minecraft-server-manager production:"$TARGET_DIR/minecraft-server-manager.new"

            echo "🚀 Step 3: Activating binary & reloading mc-manager..."
            ssh production "chmod +x $TARGET_DIR/minecraft-server-manager.new && mv $TARGET_DIR/minecraft-server-manager.new $TARGET_DIR/minecraft-server-manager && sudo systemctl restart mc-manager"
          fi

          echo "🔍 Step 4: Verifying service health..."
          ssh production "sleep 2 && curl -fsS http://127.0.0.1:5000/api/status && echo '✅ Deployment verified healthy!'"
