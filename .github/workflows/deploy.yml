name: Build & Deploy Minecraft Server Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-minecraft-manager
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'static/**'
              - 'templates/**'

  build_backend:
    name: Build Rust Backend
    needs: detect_changes
    if: needs.detect_changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Mold Linker
        uses: rui314/setup-mold@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Build Release Binary
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo build --release

      - name: Archive Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-manager
          path: target/release/minecraft-server-manager
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Streamline Deploy & Verify
    needs: [detect_changes, build_backend]
    if: always() && !cancelled() && needs.detect_changes.result == 'success' && needs.build_backend.result != 'failure' && (needs.detect_changes.outputs.rust == 'true' || needs.detect_changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Binary
        if: needs.detect_changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: minecraft-server-manager
          path: target/release/

      - name: Setup SSH Environment
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_KEY or SSH_HOST secret is missing!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          else
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa

          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 180s
            Compression yes
            LogLevel ERROR
EOF
          chmod 600 ~/.ssh/config

      - name: Deploy Assets & Binaries via Streaming Pipe
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUST_CHANGED: ${{ needs.detect_changes.outputs.rust }}
        run: |
          TARGET_DIR="/home/ubuntu/stack/games/minecraft"

          # 1. High-speed tar-stream upload for static assets and templates
          echo "📁 Streaming frontend templates and static assets to server..."
          tar -czf - static templates | ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "tar -xzf - -C $TARGET_DIR"

          # 2. Deploy binary if Rust changed
          if [ "$RUST_CHANGED" == "true" ] || [ -f "target/release/minecraft-server-manager" ]; then
            echo "📦 Uploading compiled server manager binary..."
            scp -P "$SSH_PORT" -i ~/.ssh/id_rsa target/release/minecraft-server-manager "$SSH_USER@$SSH_HOST:$TARGET_DIR/minecraft-server-manager.new"
            
            echo "🔄 Swapping binary and restarting mc-manager daemon..."
            ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
              set -e
              TARGET_DIR="/home/ubuntu/stack/games/minecraft"
              chmod +x "$TARGET_DIR/minecraft-server-manager.new"
              mv "$TARGET_DIR/minecraft-server-manager.new" "$TARGET_DIR/minecraft-server-manager"
              sudo systemctl restart mc-manager
EOF
          fi

      - name: Health Verification
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          echo "🔍 Verifying remote manager daemon health..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            sleep 2
            curl -fsS http://127.0.0.1:5000/api/status || {
              echo "Health check failed! Service logs:"
              journalctl -u mc-manager.service --no-pager -n 25
              exit 1
            }
            echo "✅ Minecraft Server Manager is healthy and active!"
EOF
